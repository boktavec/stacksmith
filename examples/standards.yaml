apiVersion: stacksmith/v2alpha1
kind: PlatformStandards
spec:
  aws:
    accountId: "123456789012" # Example only; replace before Terraform execution
    region: us-east-2
  environments:
    - dev
    - prod
  # Which parameters developers may override, per blueprint and tier. A
  # parameter without an entry cannot be overridden.
  blueprintOverrides:
    network:
      tiers:
        dev:
          parameters:
            az_count:
              minimum: 2
              maximum: 3
